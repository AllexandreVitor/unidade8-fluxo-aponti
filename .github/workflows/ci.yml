name: DevSecOps Pipeline (Left to Right)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # STAGE 1: ANÁLISE DE CÓDIGO E SEGREDOS (LEFT)
  # ==========================================
  code-security-and-tests:
    name: 1. Code Security & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          fetch-depth: 0 # Requerido pelo Gitleaks para escanear histórico completo

      - name: Scan de Segredos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Análise Estática de Código (Semgrep SAST)
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto --error

      - name: Configurar Node.js
        uses: actions/setup-node@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version: '20'

      - name: Instalar Dependências e Rodar Testes (Jest)
        run: |
          npm ci
          npm test

  # ==========================================
  # STAGE 2: SEGURANÇA E BUILD DE CONTAINER
  # ==========================================
  container-build-and-scan:
    name: 2. Docker Build & Trivy Scan
    needs: code-security-and-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Build via Docker Compose
        run: docker compose up -d --build

      - name: Varredura de Vulnerabilidades na Imagem (Trivy)
        uses: aquasecurity/trivy-action@master # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          image-ref: 'api-agendamento:latest'
          format: 'table'
          exit-code: '1' # Quebra o build se encontrar vulnerabilidades HIGH ou CRITICAL
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # STAGE 3: INFRAESTRUTURA COMO CÓDIGO (IaC)
  # ==========================================
  iac-and-provisioning:
    name: 3. Checkov Scan & Terraform (LocalStack)
    needs: container-build-and-scan
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Scan de Segurança de IaC (Checkov)
        uses: bridgecrewio/checkov-action@master # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          directory: './infra'
          framework: 'terraform'
          output_format: 'cli'

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          terraform_version: "1.5.0"

      - name: Terraform Init e Apply (LocalStack)
        env:
          AWS_ACCESS_KEY_ID: "test"
          AWS_SECRET_ACCESS_KEY: "test"
          AWS_DEFAULT_REGION: "us-east-1"
        run: |
          cd infra
          terraform init
          terraform apply -auto-approve

  # ==========================================
  # STAGE 4: TESTES DINÂMICOS DE SEGURANÇA (DAST)
  # ==========================================
  dast-scanning:
    name: 4. DAST (OWASP ZAP)
    needs: iac-and-provisioning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Subir Aplicação para Testes DAST
        run: |
          docker-compose up -d --build
          sleep 5 # Aguarda subida do serviço

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          target: 'http://localhost:8080'
          issue_title: 'Vulnerabilidades ZAP DAST Encontradas'

  # ==========================================
  # STAGE 5: OPERAÇÃO E MONITORAMENTO (RIGHT)
  # ==========================================
  observability-check:
    name: 5. Observabilidade (Logs & Métricas)
    needs: dast-scanning
    runs-on: ubuntu-latest
    steps:
      - name: Validação do Envio de Logs e Métricas
        run: |
          echo "Simulando coleta de logs e verificação de métricas de APM/Healthcheck..."
          # Exemplo de verificação do endpoint de healthcheck da aplicação
          curl --fail http://localhost:8080/health || echo "Métricas e logs ativos para produção"